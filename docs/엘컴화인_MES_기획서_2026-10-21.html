&lt;style&gt;
/* =====================================================================
   엘컴화인 MES IA (정보 구조) — 독립 HTML, 2026-10-21 개정 2
   ---------------------------------------------------------------------
   범위
     - 공정 메뉴 21개: FINE_MES 원래 구성(이름·묶음) 그대로 새 MES에 넣음
       (조작부에서 &quot;FINE_MES에서 계속 사용&quot;으로 바꿔 볼 수 있음)
     - 창고·출하·검사: 대안1 범위
     - 수금리포트: ERP 수금현황을 올리고 조회하는 업무
     - AI 리포트: 수주(생산의뢰)부터 생산·출하·수금까지 보는 리포트 모음
     - 문서관리는 제외
   구조: 묶음 → L1 대메뉴 → L2 화면(화면 ID) → L3 화면 구성
   보기 3종: 사이트맵 / 트리 목록 / 권한 매트릭스, 상단에 업무 흐름 띠
   색 개념(인쇄 CMYK에서 착안)
     시안=대안1 유지, 마젠타=FINE_MES 공정 이관, 주황=로직 변경, 옐로=신규
   ===================================================================== */
:root{
  /* --- 색 토큰 (라이트) --- */
  --bg:#f5f6f8; --surface:#ffffff; --ink:#1b2333; --muted:#5d6779; --line:#dde1e8;
  --cyan:#0b7a8a; --cyan-soft:#e0f1f3;     /* 대안1 유지 */
  --mag:#a8336a;  --mag-soft:#f6e4ec;      /* FINE_MES 공정 이관 */
  --org:#b4471f;  --org-soft:#fbe7df;      /* 로직 변경 */
  --yel:#9a6400;  --yel-soft:#fbf0d6;      /* 신규 */
  --hl:#fff3b0;                             /* 검색 강조 */
  --gray-soft:#e8eaee; --gray-ink:#7a8190;  /* 별도 시스템(문서관리) */
  /* --- 글꼴 토큰 --- */
  --f-body:&quot;IBM Plex Sans KR&quot;,&quot;Apple SD Gothic Neo&quot;,&quot;Malgun Gothic&quot;,sans-serif;
  --f-mono:&quot;IBM Plex Mono&quot;,ui-monospace,&quot;SFMono-Regular&quot;,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=&quot;light&quot;]){
    --bg:#11151d;--surface:#181e29;--ink:#e4e8ef;--muted:#99a3b5;--line:#2a3242;
    --cyan:#4cc0cf;--cyan-soft:#143039;--mag:#e07aa6;--mag-soft:#3a1c2b;
    --org:#f08a64;--org-soft:#3d1f15;--yel:#e6b54f;--yel-soft:#3a2d10;--hl:#4a4116;--gray-soft:#262c38;--gray-ink:#8b93a3;color-scheme:dark;
  }
}
:root[data-theme=&quot;dark&quot;]{
  --bg:#11151d;--surface:#181e29;--ink:#e4e8ef;--muted:#99a3b5;--line:#2a3242;
  --cyan:#4cc0cf;--cyan-soft:#143039;--mag:#e07aa6;--mag-soft:#3a1c2b;
  --org:#f08a64;--org-soft:#3d1f15;--yel:#e6b54f;--yel-soft:#3a2d10;--hl:#4a4116;--gray-soft:#262c38;--gray-ink:#8b93a3;color-scheme:dark;
}

/* ---------- 기본 ---------- */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1280px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px 64px;display:grid;gap:18px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:1.55rem}
h2{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---------- 요약 띠 ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:0}
.stats .v{font-family:var(--f-mono);font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums}
.stats .k{font-size:.74rem;color:var(--muted)}

/* ---------- 업무 흐름 띠 (수주 → 수금) ---------- */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.fstep{flex:1 1 130px;min-width:0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;display:grid;gap:1px}
.fstep:hover{border-color:var(--ink)}
.fstep b{font-size:.88rem}
.fstep span{font-size:.74rem;color:var(--muted)}
.fstep .t{font-family:var(--f-mono)}
.fstep.ext{border-style:dashed}
.farrow{align-self:center;color:var(--muted)}
@media (max-width:700px){.farrow{display:none}}

/* ---------- 조작부 ---------- */
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 12px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=&quot;true&quot;]{background:var(--ink);color:var(--surface);font-weight:600}
.controls label{display:inline-flex;align-items:center;gap:6px;font-size:.85rem}
.controls input[type=search],.controls select{padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);min-width:0}
.controls input[type=search]{width:170px}
.controls input[type=checkbox]{accent-color:var(--yel)}
.ctl-label{font-size:.78rem;color:var(--muted)}

/* ---------- 칩 ---------- */
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:0 7px;border-radius:999px;white-space:nowrap;line-height:1.6}
.s-keep{background:var(--cyan-soft);color:var(--cyan)}
.s-fine{background:var(--mag-soft);color:var(--mag)}
.s-mod{background:var(--org-soft);color:var(--org)}
.s-new{background:var(--yel-soft);color:var(--yel)}
.s-out{background:var(--bg);color:var(--muted);border:1px dashed var(--line)}
.s-ext{background:var(--gray-soft);color:var(--gray-ink)}
.t{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}

/* ---------- 본문 2열: 보기 + 상세 패널 ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:960px){.detail{position:static;max-height:none}}
.detail ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.86rem}
.detail .kv{display:grid;grid-template-columns:72px 1fr;gap:4px 10px;font-size:.85rem;margin:0}
.detail .kv dt{color:var(--muted)}
.detail .kv dd{margin:0}
.linkbtn{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:1px 8px;font-size:.78rem;cursor:pointer;margin:0 4px 4px 0}

/* ---------- 보기 1: 사이트맵 ---------- */
.bundle{display:grid;gap:10px;margin-bottom:22px}
.bundle-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px}
.bundle-h b{font-size:.95rem}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;align-items:start}
.l1{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:grid;overflow:hidden}
.l1-h{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:2px}
.l1-h b{font-size:.95rem}
.l1.new .l1-h{background:var(--yel-soft)}
.l1.fine .l1-h{background:var(--mag-soft)}
.l1.outside{opacity:.55;border-style:dashed}
.l1-list{display:grid;padding:6px}
.l2{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;background:transparent;border:0;border-radius:5px;padding:6px 8px;cursor:pointer;align-items:center}
.l2:hover{background:var(--bg)}
.l2[aria-current=&quot;true&quot;]{background:var(--cyan-soft)}
.l2 .nm{font-size:.86rem}
.l2 .id{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);grid-column:1}
.l2.dim{opacity:.35}
.l2.hit .nm{background:var(--hl);border-radius:3px}
.l2.st-mod{box-shadow:inset 3px 0 0 var(--org)}
.l2.st-new{box-shadow:inset 3px 0 0 var(--yel)}
.l2.st-fine{box-shadow:inset 3px 0 0 var(--mag)}
.batch{border-top:1px dashed var(--line);margin:4px 6px 0;padding:6px 2px;font-size:.76rem;color:var(--muted)}
.sso{font-family:var(--f-mono);font-size:.68rem;font-weight:600;color:var(--yel);border:1px solid var(--yel);border-radius:3px;padding:0 4px;white-space:nowrap}
/* 문서관리 = 별도 시스템: 카드 전체를 회색으로 */
.l1.extsys{border-style:dashed;background:var(--gray-soft)}
.l1.extsys .l1-h{background:var(--gray-soft)}
.l1.extsys .l1-h b,.l1.extsys .nm{color:var(--gray-ink)}
.l1.extsys .l2 .sso{color:var(--gray-ink);border-color:var(--gray-ink)}
.l2.st-ext{box-shadow:inset 3px 0 0 var(--gray-ink)}

/* ---------- 보기 2·3: 표 ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--bg);color:var(--muted);font-size:.76rem;font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.bgrp td{background:var(--ink);color:var(--surface);font-weight:600;font-size:.8rem}
tr.grp td{background:var(--bg);font-weight:600}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--bg)}
tr.row.sel td{background:var(--cyan-soft)}
tr.row.dim td{opacity:.35}
td.c,th.c{text-align:center}
.lv3{color:var(--muted);font-size:.8rem}
.rw{font-family:var(--f-mono);font-weight:600}
.rw.W{color:var(--cyan)}
.rw.R{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.bar{width:3px;height:14px;display:inline-block}
.warn{background:var(--org-soft);border-left:3px solid var(--org);padding:8px 12px;border-radius:4px;font-size:.85rem}
.note{font-size:.82rem;color:var(--muted);max-width:86ch;display:grid;gap:6px}
&lt;/style&gt;

&lt;div class=&quot;wrap&quot;&gt;

  &lt;!-- ===== 머리말 ===== --&gt;
  &lt;header style=&quot;display:grid;gap:6px&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;정보 구조 · 2026-10-21&lt;/p&gt;
    &lt;h1&gt;엘컴화인 MES IA&lt;/h1&gt;
    &lt;p class=&quot;muted&quot; style=&quot;max-width:76ch&quot;&gt;FINE_MES 공정 메뉴 21개를 원래 이름과 묶음 그대로 넣었습니다. 여기에 창고·출하(대안1), ERP 수금현황을 올려 조회하는 수금리포트, 수주부터 수금까지 보는 AI 리포트, 별도 문서관리 시스템으로 SSO 연결되는 문서관리 메뉴를 더했습니다. 대메뉴는 일이 흘러가는 순서(기준 → 수주·지시 → 자재·생산 → 품질·재고 → 출하·수금 → 추적·분석 → 지원)로 놓았습니다. 화면을 누르면 처리 로직과 연결 화면이 보입니다. 권한은 부서 단위이며, 부서별 사용법은 &lt;a href=&quot;https://claude.ai/artifact/TP8tvPZZJAhhWK9rkn6khi&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; style=&quot;color:var(--cyan)&quot;&gt;부서별 업무&lt;/a&gt; 페이지에 있습니다.&lt;/p&gt;
  &lt;/header&gt;

  &lt;!-- ===== 요약 띠 ===== --&gt;
  &lt;div class=&quot;stats&quot; id=&quot;stats&quot;&gt;&lt;/div&gt;

  &lt;!-- ===== 업무 흐름 띠: 수주부터 수금까지 화면이 어떻게 이어지는지 ===== --&gt;
  &lt;div style=&quot;display:grid;gap:8px&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;업무 흐름 · 수주에서 수금까지&lt;/p&gt;

  &lt;div class=&quot;controls&quot;&gt;
    &lt;div class=&quot;seg&quot; role=&quot;group&quot; aria-label=&quot;보기&quot;&gt;

    &lt;div class=&quot;seg&quot; role=&quot;group&quot; aria-label=&quot;공정 메뉴 처리&quot;&gt;
      &lt;button id=&quot;p-move&quot; data-proc=&quot;move&quot; aria-pressed=&quot;true&quot;&gt;새 MES로 이관&lt;/button&gt;
      &lt;button id=&quot;p-keep&quot; data-proc=&quot;keep&quot;&gt;FINE_MES에서 계속 사용&lt;/button&gt;

    &lt;label for=&quot;opt-ai&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;opt-ai&quot; checked&gt;AI 리포트&lt;/label&gt;

  document.getElementById(&#x27;flow&#x27;).innerHTML = FLOW.map((f,i)=&gt;{
    const e = IDX[f.id]; const off = !inScope(e.l);
    const where = off ? (e.l.opt===&#x27;proc&#x27; ? &#x27;FINE_MES&#x27; : &#x27;범위 밖&#x27;) : f.id;
    return (i?&#x27;&lt;span class=&quot;farrow&quot;&gt;→&lt;/span&gt;&#x27;:&#x27;&#x27;) +
      `&lt;button class=&quot;fstep ${f.ext?&#x27;ext&#x27;:&#x27;&#x27;}&quot; data-sel=&quot;${f.id}&quot; style=&quot;${off?&#x27;opacity:.5&#x27;:&#x27;&#x27;}&quot;&gt;
        &lt;span class=&quot;t&quot;&gt;${where}&lt;/span&gt;&lt;b&gt;${f.step}&lt;/b&gt;&lt;span&gt;${f.sub}${f.ext?&#x27; (ERP)&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;/button&gt;`;
  }).join(&#x27;&#x27;);
}

/* =======================================================================
   6. 보기 1: 사이트맵 (묶음 → 대메뉴 카드 → 화면 버튼)
   ======================================================================= */
function drawMap(){
  let n = 0;
  return BUNDLES.map(b=&gt;{
    const tops = IA.filter(l=&gt;l.bundle===b.key &amp;&amp; visible(l));
    if(!tops.length) return &#x27;&#x27;;
    return `&lt;div class=&quot;bundle&quot;&gt;&lt;div class=&quot;bundle-h&quot;&gt;&lt;b&gt;${b.name}&lt;/b&gt;&lt;span class=&quot;small muted&quot;&gt;${b.desc}&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;map&quot;&gt;${tops.map(l=&gt;{ n++;
        const out = !inScope(l);
        const meta = `${l.screens.length}개 화면`;
        return `&lt;div class=&quot;l1 ${l.kind===&#x27;new&#x27;&amp;&amp;l.code!==&#x27;DOC&#x27;?&#x27;new&#x27;:&#x27;&#x27;} ${l.kind===&#x27;fine&#x27;?&#x27;fine&#x27;:&#x27;&#x27;} ${out?&#x27;outside&#x27;:&#x27;&#x27;} ${l.code===&#x27;DOC&#x27;?&#x27;extsys&#x27;:&#x27;&#x27;}&quot;&gt;
          &lt;div class=&quot;l1-h&quot;&gt;&lt;span class=&quot;t&quot;&gt;${n}. ${l.code}&lt;/span&gt;&lt;b&gt;${l.name}&lt;/b&gt;
            &lt;span class=&quot;small muted&quot;&gt;${meta} ${l.code===&#x27;DOC&#x27;?&#x27;&lt;span class=&quot;chip s-ext&quot;&gt;별도 시스템&lt;/span&gt;&#x27;:(l.kind===&#x27;new&#x27;?&#x27;&lt;span class=&quot;chip s-new&quot;&gt;신규&lt;/span&gt;&#x27;:&#x27;&#x27;)}${l.kind===&#x27;fine&#x27;?`&lt;span class=&quot;chip ${out?&#x27;s-out&#x27;:&#x27;s-fine&#x27;}&quot;&gt;${out?&#x27;FINE_MES&#x27;:&#x27;이관&#x27;}&lt;/span&gt;`:&#x27;&#x27;}&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;l1-list&quot;&gt;${l.screens.map(s=&gt;{const st=effSt(s,l);
            return `&lt;button class=&quot;l2 st-${st} ${matches(s,l)?&#x27;&#x27;:&#x27;dim&#x27;} ${hit(s)?&#x27;hit&#x27;:&#x27;&#x27;}&quot; data-sel=&quot;${s.id}&quot; aria-current=&quot;${state.sel===s.id}&quot;&gt;
              &lt;span class=&quot;nm&quot;&gt;${s.name}${s.sso?&#x27; &lt;span class=&quot;sso&quot;&gt;↗ SSO&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;${s.type}&lt;/span&gt;&lt;span class=&quot;id&quot;&gt;${s.id}&lt;/span&gt;&lt;/button&gt;`;}).join(&#x27;&#x27;)}
          ${(l.batch||[]).map(x=&gt;`&lt;p class=&quot;batch&quot;&gt;배치 · ${x}&lt;/p&gt;`).join(&#x27;&#x27;)}
          ${(l.data||[]).length?`&lt;p class=&quot;batch&quot;&gt;데이터 · ${l.data.join(&#x27;, &#x27;)}&lt;/p&gt;`:&#x27;&#x27;}
          &lt;/div&gt;&lt;/div&gt;`;}).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`;
  }).join(&#x27;&#x27;);
}

/* =======================================================================
   7. 보기 2: 트리 목록
   ======================================================================= */
function drawTree(){
  let n = 0;
  const rows = BUNDLES.map(b=&gt;{
    const tops = IA.filter(l=&gt;l.bundle===b.key &amp;&amp; visible(l));
    if(!tops.length) return &#x27;&#x27;;
    return `&lt;tr class=&quot;bgrp&quot;&gt;&lt;td colspan=&quot;4&quot;&gt;${b.name} · ${b.desc}&lt;/td&gt;&lt;/tr&gt;` + tops.map(l=&gt;{ n++;
      /* 트리 목록도 프로세스 순서(ORDER)를 따른다 */
      return `&lt;tr class=&quot;grp&quot;&gt;&lt;td class=&quot;mono&quot;&gt;${l.code}&lt;/td&gt;&lt;td colspan=&quot;3&quot;&gt;${n}. ${l.name}${l.code===&#x27;DOC&#x27;?&#x27; · 별도 시스템&#x27;:&#x27;&#x27;}&lt;/td&gt;&lt;/tr&gt;` +
        l.screens.map(s=&gt;{const st=effSt(s,l);
          return `&lt;tr class=&quot;row ${state.sel===s.id?&#x27;sel&#x27;:&#x27;&#x27;} ${matches(s,l)?&#x27;&#x27;:&#x27;dim&#x27;}&quot; data-sel=&quot;${s.id}&quot;&gt;
            &lt;td class=&quot;mono&quot;&gt;${s.id}&lt;/td&gt;
            &lt;td&gt;&lt;b ${hit(s)?&#x27;style=&quot;background:var(--hl)&quot;&#x27;:&#x27;&#x27;}&gt;${s.name}&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;lv3&quot;&gt;${s.l3.join(&#x27; · &#x27;)}&lt;/span&gt;${s.orig?`&lt;br&gt;&lt;span class=&quot;lv3&quot;&gt;FINE_MES: ${s.orig}&lt;/span&gt;`:&#x27;&#x27;}&lt;/td&gt;
            &lt;td&gt;${s.type}&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;chip ${ST[st][1]}&quot;&gt;${ST[st][0]}&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;`;}).join(&#x27;&#x27;);
    }).join(&#x27;&#x27;);
  }).join(&#x27;&#x27;);
  return `&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;화면 ID&lt;/th&gt;&lt;th&gt;화면 · 구성(L3)&lt;/th&gt;&lt;th&gt;유형&lt;/th&gt;&lt;th&gt;상태&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`;
}

/* =======================================================================
   8. 보기 3: 권한 매트릭스
   ======================================================================= */
function drawRole(){
  const rows = IA.filter(visible).map((l,i)=&gt;
    `&lt;tr class=&quot;grp&quot;&gt;&lt;td colspan=&quot;${ROLES.length+2}&quot;&gt;${i+1}. ${l.name}${inScope(l)?&#x27;&#x27;:&#x27; (FINE_MES에서 사용)&#x27;}&lt;/td&gt;&lt;/tr&gt;` +
    l.screens.map(s=&gt;`&lt;tr class=&quot;row ${state.sel===s.id?&#x27;sel&#x27;:&#x27;&#x27;} ${matches(s,l)?&#x27;&#x27;:&#x27;dim&#x27;}&quot; data-sel=&quot;${s.id}&quot;&gt;
      &lt;td class=&quot;mono&quot;&gt;${s.id}&lt;/td&gt;&lt;td&gt;${s.name}&lt;/td&gt;
      ${ROLES.map(r=&gt;`&lt;td class=&quot;c&quot;&gt;${s.roles[r.id]?`&lt;span class=&quot;rw ${s.roles[r.id]}&quot;&gt;${s.roles[r.id]}&lt;/span&gt;`:&#x27;&lt;span class=&quot;muted&quot;&gt;·&lt;/span&gt;&#x27;}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`).join(&#x27;&#x27;)
  ).join(&#x27;&#x27;);
  return `&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;화면 ID&lt;/th&gt;&lt;th&gt;화면&lt;/th&gt;${ROLES.map(r=&gt;`&lt;th class=&quot;c&quot; ${state.role===r.id?&#x27;style=&quot;color:var(--ink)&quot;&#x27;:&#x27;&#x27;}&gt;${r.name}&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`;
}

/* =======================================================================
   9. 상세 패널
   ======================================================================= */
function drawDetail(){
  const box = document.getElementById(&#x27;detail&#x27;);
  const e = IDX[state.sel];
  if(!e || !visible(e.l)){ box.innerHTML = `&lt;p class=&quot;muted small&quot;&gt;화면을 고르면 처리 로직과 연결 화면이 여기에 보입니다.&lt;/p&gt;`; return; }
  const {s,l} = e, st = effSt(s,l);
  const links = (s.links||[]).filter(id=&gt;IDX[id] &amp;&amp; visible(IDX[id].l));
  // 원천 데이터가 범위 밖이면 안내
  let srcNote = &#x27;&#x27;;
  if(s.src===&#x27;proc&#x27; &amp;&amp; state.proc===&#x27;keep&#x27;) srcNote = &#x27;공정을 FINE_MES에 두면 이 리포트는 FINE_MES 데이터 연계가 있어야 만들 수 있습니다.&#x27;;
  if(s.src===&#x27;col&#x27; &amp;&amp; !state.col) srcNote = &#x27;수금리포트가 꺼져 있어 이 리포트의 원천이 없습니다.&#x27;;
  box.innerHTML = `
    &lt;div style=&quot;display:grid;gap:4px&quot;&gt;
      &lt;p class=&quot;t&quot;&gt;${s.id}&lt;/p&gt;
      &lt;h2&gt;${s.name}&lt;/h2&gt;
      &lt;p class=&quot;small muted&quot;&gt;${l.name} › ${s.name}&lt;/p&gt;
    &lt;/div&gt;
    &lt;dl class=&quot;kv&quot;&gt;
      &lt;dt&gt;유형&lt;/dt&gt;&lt;dd&gt;${s.type}&lt;/dd&gt;
      &lt;dt&gt;상태&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;chip ${ST[st][1]}&quot;&gt;${ST[st][0]}&lt;/span&gt;&lt;/dd&gt;
      ${s.orig?`&lt;dt&gt;FINE_MES&lt;/dt&gt;&lt;dd&gt;${s.orig}&lt;/dd&gt;`:&#x27;&#x27;}
      &lt;dt&gt;권한&lt;/dt&gt;&lt;dd&gt;${ROLES.filter(r=&gt;s.roles[r.id]).map(r=&gt;`${r.name} &lt;span class=&quot;rw ${s.roles[r.id]}&quot;&gt;${s.roles[r.id]}&lt;/span&gt;`).join(&#x27;, &#x27;)}&lt;/dd&gt;
    &lt;/dl&gt;
    ${srcNote?`&lt;p class=&quot;warn&quot;&gt;${srcNote}&lt;/p&gt;`:&#x27;&#x27;}
    ${s.sso?`&lt;p class=&quot;small muted&quot;&gt;이 메뉴는 MES 화면이 아닙니다. 별도 문서관리 시스템으로 SSO 로그인해 새 창으로 넘어갑니다. 문서관리 시스템은 MES와 별도로 구축·운영합니다.&lt;/p&gt;`:&#x27;&#x27;}
    &lt;div style=&quot;display:grid;gap:6px&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;화면 구성&lt;/p&gt;&lt;ul&gt;${s.l3.map(x=&gt;`&lt;li&gt;${x}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;&lt;/div&gt;
    &lt;div style=&quot;display:grid;gap:6px&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;처리 로직&lt;/p&gt;&lt;ul&gt;${s.logic.map(x=&gt;`&lt;li&gt;${x}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;&lt;/div&gt;
    ${links.length?`&lt;div style=&quot;display:grid;gap:6px&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;연결 화면&lt;/p&gt;&lt;div&gt;${links.map(id=&gt;`&lt;button class=&quot;linkbtn&quot; data-sel=&quot;${id}&quot;&gt;${id} ${IDX[id].s.name}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`:&#x27;&#x27;}`;
}

/* =======================================================================
   10. 그리기 + 이벤트
   ======================================================================= */
function render(){
  drawStats(); drawFlow();
  document.getElementById(&#x27;view&#x27;).innerHTML = state.view===&#x27;map&#x27; ? drawMap() : state.view===&#x27;tree&#x27; ? drawTree() : drawRole();
  drawDetail();
}
document.getElementById(&#x27;role&#x27;).insertAdjacentHTML(&#x27;beforeend&#x27;, ROLES.map(r=&gt;`&lt;option value=&quot;${r.id}&quot;&gt;${r.name}&lt;/option&gt;`).join(&#x27;&#x27;));

/* 같은 그룹 안에서 눌림 표시를 옮기는 공통 함수 */
function bindSeg(attr, key){
  document.querySelectorAll(`[data-${attr}]`).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{
    state[key]=b.dataset[attr];
    document.querySelectorAll(`[data-${attr}]`).forEach(x=&gt;x.setAttribute(&#x27;aria-pressed&#x27;,x===b));
    render();
  }));
}
bindSeg(&#x27;view&#x27;,&#x27;view&#x27;); bindSeg(&#x27;st&#x27;,&#x27;st&#x27;); bindSeg(&#x27;proc&#x27;,&#x27;proc&#x27;);
document.getElementById(&#x27;role&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{ state.role=e.target.value; render(); });
document.getElementById(&#x27;q&#x27;).addEventListener(&#x27;input&#x27;,e=&gt;{ state.q=e.target.value.trim(); render(); });
document.getElementById(&#x27;opt-col&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{ state.col=e.target.checked; render(); });
document.getElementById(&#x27;opt-ai&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{ state.ai=e.target.checked; render(); });
document.getElementById(&#x27;opt-doc&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{ state.doc=e.target.checked; render(); });
document.getElementById(&#x27;opt-self&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{ state.self=e.target.checked; render(); });

/* 화면 선택: 사이트맵 버튼, 표 행, 흐름 띠, 연결 화면 버튼 공통 */
document.addEventListener(&#x27;click&#x27;,e=&gt;{
  const t=e.target.closest(&#x27;[data-sel]&#x27;); if(!t) return;
  state.sel=t.dataset.sel; render();
  if(window.matchMedia(&#x27;(max-width:960px)&#x27;).matches) document.getElementById(&#x27;detail&#x27;).scrollIntoView({behavior:&#x27;smooth&#x27;,block:&#x27;start&#x27;});
});

render();
&lt;/script&gt;

&lt;link rel=&quot;stylesheet&quot; href=&quot;https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap&quot;&gt;
&lt;style&gt;
/* =====================================================================
   엘컴화인 MES 부서별 업무 가이드 — 탭 페이지 (2026-10-21)
   ---------------------------------------------------------------------
   목적: 각 부서가 다른 부서에 묻거나 요청하지 않고 MES에서 직접 처리하는 방법
   기준: 개정 12 기준안 (공정 메뉴 이관 + 수금리포트 + AI 리포트 + 문서관리 SSO + 내 업무·통합 조회)
   데이터: 화면별 부서 권한(IA_DATA)은 &quot;엘컴화인 MES IA&quot; 페이지의 데이터를 그대로 옮긴 것
   탭: #sales #prod #ship #design #acct #strat #exec #admin (주소 뒤 #으로 바로 열 수 있음)
   ===================================================================== */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#1b2333; --muted:#5d6779; --line:#dde1e8;
  --cyan:#0b7a8a; --cyan-soft:#e0f1f3;
  --yel:#9a6400;  --yel-soft:#fbf0d6;
  --org:#b4471f;  --org-soft:#fbe7df;
  --ok:#2f7a3d;   --ok-soft:#e3f1e5;
  --gray-soft:#e8eaee; --gray-ink:#7a8190;   /* 별도 시스템(문서관리) */
  --f-body:&quot;IBM Plex Sans KR&quot;,&quot;Apple SD Gothic Neo&quot;,&quot;Malgun Gothic&quot;,sans-serif;
  --f-mono:&quot;IBM Plex Mono&quot;,ui-monospace,&quot;SFMono-Regular&quot;,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=&quot;light&quot;]){
    --bg:#11151d;--surface:#181e29;--ink:#e4e8ef;--muted:#99a3b5;--line:#2a3242;
    --cyan:#4cc0cf;--cyan-soft:#143039;--yel:#e6b54f;--yel-soft:#3a2d10;
    --org:#f08a64;--org-soft:#3d1f15;--ok:#6cc27b;--ok-soft:#173222;--gray-soft:#262c38;--gray-ink:#8b93a3;color-scheme:dark;
  }
}
:root[data-theme=&quot;dark&quot;]{
  --bg:#11151d;--surface:#181e29;--ink:#e4e8ef;--muted:#99a3b5;--line:#2a3242;
  --cyan:#4cc0cf;--cyan-soft:#143039;--yel:#e6b54f;--yel-soft:#3a2d10;
  --org:#f08a64;--org-soft:#3d1f15;--ok:#6cc27b;--ok-soft:#173222;--gray-soft:#262c38;--gray-ink:#8b93a3;color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px 64px;display:grid;gap:20px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:1.55rem} h2{font-size:1.15rem} h3{font-size:.98rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
a{color:var(--cyan)}

/* ---------- 점검 결과 ---------- */
.verdict{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.verdict div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.verdict .v{font-family:var(--f-mono);font-weight:600;font-size:1.3rem}
.verdict .ok{border-left:3px solid var(--ok)}
.verdict .part{border-left:3px solid var(--yel)}
.verdict .no{border-left:3px solid var(--org)}

/* ---------- 탭 ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--ink);padding-bottom:0}
.tabs button{flex:none;border:1px solid var(--line);border-bottom:0;background:var(--surface);border-radius:6px 6px 0 0;padding:8px 14px;cursor:pointer;font-size:.9rem;color:var(--muted)}
.tabs button[aria-selected=&quot;true&quot;]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.grid2&gt;*{min-width:0}

/* ---------- 이전 → 이제 표 ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg);color:var(--muted);font-size:.78rem;font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.before{color:var(--muted)}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:0 7px;border-radius:999px;white-space:nowrap;line-height:1.6}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-part{background:var(--yel-soft);color:var(--yel)}
.c-no{background:var(--org-soft);color:var(--org)}
.sid{font-family:var(--f-mono);font-size:.75rem;color:var(--cyan);white-space:nowrap}

/* ---------- 하루 흐름 ---------- */
.day{list-style:none;margin:0;padding:0;display:grid;gap:0}
.day li{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.day li:first-child{border-top:0}
.day .when{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:2px}
.day b{font-size:.92rem}
.day p{font-size:.86rem;color:var(--muted)}

/* ---------- 알림 주고받기 ---------- */
.hand{display:grid;gap:6px;font-size:.88rem}
.hand div{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.arr{font-family:var(--f-mono);font-weight:600}
.arr.in{color:var(--cyan)} .arr.out{color:var(--yel)}

/* ---------- 화면 목록 ---------- */
.scr{display:grid;gap:10px}
.scr-grp{display:grid;gap:4px}
.scr-grp h3{font-size:.82rem;color:var(--muted)}
.scr-list{display:flex;flex-wrap:wrap;gap:6px}
.s{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:5px;padding:3px 8px;font-size:.82rem;background:var(--surface)}
.s.W{border-color:var(--cyan);background:var(--cyan-soft)}
/* 문서관리 = 별도 시스템: 회색 점선 */
.s.ext{background:var(--gray-soft);border-color:var(--gray-ink);border-style:dashed;color:var(--gray-ink)}
.s.ext .sid{color:var(--gray-ink)}
.tag-ext{font-size:.68rem;color:var(--gray-ink);border:1px solid var(--gray-ink);border-radius:3px;padding:0 4px}
.s .sid{font-size:.68rem}
.elsewhere{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.88rem}
.note{font-size:.82rem;color:var(--muted);max-width:86ch}

    &lt;p class=&quot;eyebrow&quot;&gt;부서 간 업무 변화 · 2026-10-21&lt;/p&gt;
    &lt;h1&gt;엘컴화인 MES 부서 간 업무 변화&lt;/h1&gt;
    &lt;p class=&quot;muted&quot; style=&quot;max-width:72ch&quot;&gt;부서마다 MES에서 무엇을 직접 처리하고 무엇을 직접 확인하는지 정리했습니다. 전에는 다른 부서에 전화나 메신저로 묻던 일이 이제 어느 화면에서 해결되는지가 핵심입니다. 화면 ID는 &lt;a href=&quot;https://claude.ai/artifact/NJJXwqh83Y1mDUjnQiuvqW&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MES IA&lt;/a&gt;와 같습니다.&lt;/p&gt;
  &lt;/header&gt;

  &lt;!-- ===== 점검 결과: 부서 간 요청이 얼마나 없어지는가 ===== --&gt;
  &lt;section style=&quot;display:grid;gap:10px&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;점검 결과&lt;/p&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;verdict&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;MES는 수주부터 출하·수금 조회까지 전 직원이 직접 처리하는 기반이 됩니다. 다만 FINE_MES에 남는 16개 메뉴(영업 매출·발주, 근태, 품의·지출, 원가, 개발실 일보)와 ERP 회계 업무는 MES 밖에 있습니다. 이 일들은 각 탭의 &quot;MES 밖에서 하는 일&quot;에 따로 적었습니다.&lt;/p&gt;
  &lt;/section&gt;

  &lt;!-- ===== 부서 탭 ===== --&gt;
  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; id=&quot;tabs&quot; aria-label=&quot;부서&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;pane&quot; role=&quot;tabpanel&quot;&gt;&lt;/div&gt;

  &lt;p class=&quot;note&quot;&gt;FINE_MES 공정 메뉴를 새 MES에 포함한 구성 기준입니다. 문서관리는 별도 시스템이며 MES 메뉴에서 SSO로 넘어갑니다(회색 표시). 알림을 메일·메신저로도 받을 수 있을지는 엘컴화인 환경을 확인한 뒤 정합니다.&lt;/p&gt;
&lt;/div&gt;

  outN:[],
  out:[]}
];

/* =======================================================================
   3. 점검 결과 집계
   ======================================================================= */
(function(){
  const all = DEPTS.flatMap(d=&gt;d.req);
  const ok = all.filter(r=&gt;r[2]===&#x27;ok&#x27;).length, part = all.filter(r=&gt;r[2]===&#x27;part&#x27;).length, no = all.filter(r=&gt;r[2]===&#x27;no&#x27;).length;
  document.getElementById(&#x27;verdict&#x27;).innerHTML = `
    &lt;div class=&quot;ok&quot;&gt;&lt;p class=&quot;small muted&quot;&gt;MES에서 직접 해결&lt;/p&gt;&lt;p class=&quot;v&quot;&gt;${ok}건&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;부서 간 문의·요청이 없어짐&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;part&quot;&gt;&lt;p class=&quot;small muted&quot;&gt;일부 해결&lt;/p&gt;&lt;p class=&quot;v&quot;&gt;${part}건&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;숫자는 직접, 사유는 확인 필요&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;no&quot;&gt;&lt;p class=&quot;small muted&quot;&gt;MES 밖&lt;/p&gt;&lt;p class=&quot;v&quot;&gt;${no}건&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;FINE_MES 잔류·ERP 업무&lt;/p&gt;&lt;/div&gt;
    &lt;div&gt;&lt;p class=&quot;small muted&quot;&gt;점검한 요청&lt;/p&gt;&lt;p class=&quot;v&quot;&gt;${all.length}건&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;${DEPTS.length}개 부서&lt;/p&gt;&lt;/div&gt;`;
})();

/* =======================================================================
   4. 탭 그리기
   ======================================================================= */
const ST = {ok:[&#x27;직접 해결&#x27;,&#x27;c-ok&#x27;], part:[&#x27;일부&#x27;,&#x27;c-part&#x27;], no:[&#x27;MES 밖&#x27;,&#x27;c-no&#x27;]};
function screensFor(role){
  // 부서가 W(처리) 또는 R(조회)할 수 있는 화면을 대메뉴별로 묶음 (전산 관리자는 처리 화면만)
  return IA_DATA.map(l=&gt;({top:l.name, items:l.screens.filter(s=&gt;s.roles[role] &amp;&amp; !(role===&#x27;ADM&#x27; &amp;&amp; s.roles[role]===&#x27;R&#x27;))}))
    .filter(g=&gt;g.items.length);
}
function drawPane(key){
  const d = DEPTS.find(x=&gt;x.key===key) || DEPTS[0];
  document.querySelectorAll(&#x27;#tabs button&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-selected&#x27;, b.dataset.key===d.key));
  const groups = screensFor(d.role);
  const nW = groups.reduce((a,g)=&gt;a+g.items.filter(s=&gt;s.roles[d.role]===&#x27;W&#x27;).length,0);
  const nR = groups.reduce((a,g)=&gt;a+g.items.filter(s=&gt;s.roles[d.role]===&#x27;R&#x27;).length,0);
  document.getElementById(&#x27;pane&#x27;).innerHTML = `
  &lt;div style=&quot;display:grid;gap:14px&quot;&gt;
    &lt;div style=&quot;display:grid;gap:4px&quot;&gt;&lt;h2&gt;${d.name}&lt;/h2&gt;&lt;p class=&quot;muted&quot; style=&quot;max-width:72ch&quot;&gt;${d.lead}&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;이전 (다른 부서에 묻거나 요청)&lt;/th&gt;&lt;th&gt;이제 (MES에서 직접)&lt;/th&gt;&lt;th&gt;결과&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;${d.req.map(([b,ids,st,n])=&gt;`&lt;tr&gt;&lt;td class=&quot;before&quot;&gt;${b}&lt;/td&gt;
        &lt;td&gt;${ids.length?ids.map(nm).join(&#x27;&lt;br&gt;&#x27;):&#x27;-&#x27;}${n?`&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;${n}&lt;/span&gt;`:&#x27;&#x27;}&lt;/td&gt;
        &lt;td&gt;&lt;span class=&quot;chip ${ST[st][1]}&quot;&gt;${ST[st][0]}&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;
    &lt;/table&gt;&lt;/div&gt;

    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;하루 업무 흐름&lt;/h3&gt;
        &lt;ol class=&quot;day&quot;&gt;${d.day.map(([w,t,ids,n])=&gt;`&lt;li&gt;&lt;span class=&quot;when&quot;&gt;${w}&lt;/span&gt;&lt;div&gt;&lt;b&gt;${t}&lt;/b&gt; ${ids.map(sid).join(&#x27; &#x27;)}${n?`&lt;p&gt;${n}&lt;/p&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ol&gt;
      &lt;/div&gt;
      &lt;div style=&quot;display:grid;gap:14px;align-content:start&quot;&gt;
        &lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;알림 주고받기&lt;/h3&gt;
          &lt;div class=&quot;hand&quot;&gt;
            ${d.inN.map(t=&gt;`&lt;div&gt;&lt;span class=&quot;arr in&quot;&gt;받음 ←&lt;/span&gt;&lt;span&gt;${t}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}
            ${d.outN.map(t=&gt;`&lt;div&gt;&lt;span class=&quot;arr out&quot;&gt;보냄 →&lt;/span&gt;&lt;span&gt;${t}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}
            ${!d.inN.length&amp;&amp;!d.outN.length?&#x27;&lt;p class=&quot;small muted&quot;&gt;없음&lt;/p&gt;&#x27;:&#x27;&#x27;}
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;MES 밖에서 하는 일&lt;/h3&gt;
          ${d.out.length?`&lt;ul class=&quot;elsewhere&quot;&gt;${d.out.map(t=&gt;`&lt;li&gt;${t}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;`:&#x27;&lt;p class=&quot;small muted&quot;&gt;없음. 이 부서의 일은 MES 안에서 끝납니다.&lt;/p&gt;&#x27;}
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;h3&gt;쓸 수 있는 화면 · 처리 ${nW}개 · 조회 ${nR}개&lt;/h3&gt;
      &lt;div class=&quot;scr&quot;&gt;${groups.map(g=&gt;`&lt;div class=&quot;scr-grp&quot;&gt;&lt;h3&gt;${g.top}&lt;/h3&gt;&lt;div class=&quot;scr-list&quot;&gt;${g.items.map(s=&gt;
        (g.top===&#x27;문서관리&#x27;
          ? `&lt;span class=&quot;s ext&quot;&gt;${s.name}${s.sso?&#x27; ↗&#x27;:&#x27;&#x27;} &lt;span class=&quot;sid&quot;&gt;${s.id}&lt;/span&gt; &lt;span class=&quot;tag-ext&quot;&gt;별도 시스템&lt;/span&gt;&lt;/span&gt;`
          : `&lt;span class=&quot;s ${s.roles[d.role]}&quot;&gt;${s.name} &lt;span class=&quot;sid&quot;&gt;${s.id}&lt;/span&gt; &lt;span class=&quot;mono small&quot;&gt;${s.roles[d.role]}&lt;/span&gt;&lt;/span&gt;`)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
      &lt;p class=&quot;small muted&quot;&gt;파란 칸은 직접 처리(W), 흰 칸은 조회(R), 회색 점선은 별도 시스템(문서관리)입니다.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;`;
}
document.getElementById(&#x27;tabs&#x27;).innerHTML = DEPTS.map(d=&gt;`&lt;button role=&quot;tab&quot; id=&quot;tab-${d.key}&quot; data-key=&quot;${d.key}&quot;&gt;${d.name}&lt;/button&gt;`).join(&#x27;&#x27;);
document.getElementById(&#x27;tabs&#x27;).addEventListener(&#x27;click&#x27;,e=&gt;{
  const b=e.target.closest(&#x27;[data-key]&#x27;); if(!b) return;
  drawPane(b.dataset.key);
  try{ history.replaceState(null,&#x27;&#x27;,&#x27;#&#x27;+b.dataset.key); }catch(err){}
});
/* 주소 뒤 #sales 같은 탭 이름으로 바로 열기 */
const start = (location.hash||&#x27;&#x27;).slice(1);
drawPane(DEPTS.some(d=&gt;d.key===start) ? start : &#x27;sales&#x27;);
&lt;/script&gt;
&lt;/html&gt;" hidden></iframe></main>

<script>
/* 원본 아티팩트 ID → 탭 키 (페이지 안 링크를 탭 전환으로 바꾸는 데 씀) */
const ID_MAP = {'NJJXwqh83Y1mDUjnQiuvqW': 'ia', 'TP8tvPZZJAhhWK9rkn6khi': 'guide'};
const KEYS = ['ia','guide'];
const frame = k => document.getElementById('f-'+k);

/* 탭 보이기 */
function show(key){
  if(!KEYS.includes(key)) key='ia';
  KEYS.forEach(k=>{ frame(k).hidden = k!==key; document.getElementById('t-'+k).setAttribute('aria-selected', k===key); });
  try{ history.replaceState(null,'','#'+key); }catch(e){}
}
document.querySelector('.tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-key]'); if(b) show(b.dataset.key); });

/* 화면 구조 탭에서 특정 화면 열기 (IA 페이지의 state·render 를 호출) */
function openScreen(id){
  show('ia');
  try{
    const w = frame('ia').contentWindow;
    w.eval('state.sel=' + JSON.stringify(id) + '; render();');
    const d = w.document.getElementById('detail'); if(d && w.innerWidth<=960) d.scrollIntoView({block:'start'});
  }catch(e){}
}

/* 테마: 뷰어가 고른 data-theme 를 각 페이지에도 같게 적용 */
function syncTheme(){
  const t = document.documentElement.getAttribute('data-theme');
  KEYS.forEach(k=>{ try{ const r=frame(k).contentDocument.documentElement;
    if(t) r.setAttribute('data-theme',t); else r.removeAttribute('data-theme'); }catch(e){} });
}
new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* 각 페이지가 열리면: 테마 맞추기, 페이지 간 링크 가로채기, 가이드의 화면 ID 클릭 연결 */
KEYS.forEach(k=>frame(k).addEventListener('load',()=>{
  let doc; try{ doc = frame(k).contentDocument; }catch(e){ return; }
  syncTheme();
  doc.addEventListener('click',e=>{
    const a = e.target.closest('a[href]');
    if(a){ const hit = Object.keys(ID_MAP).find(id=>a.href.includes(id)); if(hit){ e.preventDefault(); show(ID_MAP[hit]); return; } }
    if(k==='guide'){ const s=e.target.closest('.sid'); if(s){ e.preventDefault(); openScreen(s.textContent.trim()); } }
  });
  if(k==='guide'){ const st=doc.createElement('style'); st.textContent='.sid{cursor:pointer;text-decoration:underline dotted}'; doc.head.appendChild(st); }
}));

/* 주소 뒤 #ia #guide 로 바로 열기 */
show((location.hash||'').slice(1));
</script>
