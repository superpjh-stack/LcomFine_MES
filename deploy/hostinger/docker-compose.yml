# 엘컴화인 MES — Hostinger VPS Docker Manager 용 compose (D-31)
#
# Docker Manager 는 compose 파일 **하나만** 받아 가고 저장소는 받지 않는다 → `build:` 도 호스트 bind-mount 도 안 된다(컨테이너 0 으로 끝난다).
# 그래서 여기서는 GitHub Actions(`.github/workflows/image.yml`)가 main 에 올린 이미지 ghcr.io 를 그대로 쓴다.
#
#   1) hPanel → Docker Manager → 앱 → .yaml 편집기에 이 파일을 넣는다.
#   2) 「환경」 칸에 비밀 세 개를 넣는다 (값은 저장소·문서에 적지 않는다 — G-19):
#        LCOMFINE_DB_PASSWORD · LCOMFINE_SESSION_SECRET · LCOMFINE_SEED_PASSWORD   (+ LCOMFINE_HOST_PORT — 비어 있는 포트)
#   3) 배포 → http://<호스트>:<포트>/health 가 {"system":"엘컴화인 MES", …}
#
# · 이 VPS 에서 8000 · 8010~8032 는 다른 사업이 쓴다 → 기본 8040 (D-31). DB 는 호스트로 포트를 내지 않는다.
# · 새 버전: main 에 push → Actions 가 이미지를 다시 올린다 → hPanel 에서 다시 배포(이미지를 새로 받는다 — pull_policy always).
# · 백업 · 샘플 데이터: 루트 docker-compose.yml 머리말과 같다(`docker compose exec app …` 대신 hPanel 의 컨테이너 터미널).

x-app-image: &app-image ghcr.io/superpjh-stack/lcomfine_mes:latest

x-app-env: &app-env
  LCOMFINE_ENV: ${LCOMFINE_ENV:-prod}
  LCOMFINE_PORT: "8020"
  LCOMFINE_PG_DSN: postgresql://lcomfine:${LCOMFINE_DB_PASSWORD:?환경 칸에 LCOMFINE_DB_PASSWORD 를 넣는다}@db:5432/lcomfine_db
  LCOMFINE_SESSION_SECRET: ${LCOMFINE_SESSION_SECRET:?환경 칸에 LCOMFINE_SESSION_SECRET 를 넣는다 (비우면 재기동마다 로그인이 풀린다)}
  LCOMFINE_SEED_PASSWORD: ${LCOMFINE_SEED_PASSWORD:?환경 칸에 LCOMFINE_SEED_PASSWORD 를 넣는다 (기본 비밀번호는 없다 — G-19)}
  LCOMFINE_SESSION_IDLE_MINUTES: ${LCOMFINE_SESSION_IDLE_MINUTES:-}
  LCOMFINE_BOARD_REFRESH_SECONDS: ${LCOMFINE_BOARD_REFRESH_SECONDS:-}
  TZ: ${TZ:-Asia/Seoul}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: lcomfine_db
      POSTGRES_USER: lcomfine
      POSTGRES_PASSWORD: ${LCOMFINE_DB_PASSWORD:?환경 칸에 LCOMFINE_DB_PASSWORD 를 넣는다}
      TZ: ${TZ:-Asia/Seoul}          # 집계의 「날짜가 기간 안」 은 DB 세션 시간대의 날짜다 (D-301)
    volumes:
      - lcomfine-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcomfine -d lcomfine_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  seed:                              # 빈 DB 면 schema.sql 적용 → 시드 (tools/docker_init.py). 한 번 돌고 끝난다
    image: *app-image
    pull_policy: always
    restart: "no"
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    command: ["/app/.venv/bin/python", "tools/docker_init.py"]

  app:
    image: *app-image
    pull_policy: always
    restart: unless-stopped
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "${LCOMFINE_HOST_PORT:-8040}:8020"
    volumes:
      - lcomfine-backups:/app/backups

volumes:
  lcomfine-db:
  lcomfine-backups:
