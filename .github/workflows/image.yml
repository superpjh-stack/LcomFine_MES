# 엘컴화인 MES — 앱 이미지를 GitHub Container Registry 에 올린다 (D-31)
#
# main 에 push 될 때마다 Dockerfile 로 빌드해 ghcr.io/superpjh-stack/lcomfine_mes 에 `latest` 와 `sha-<커밋>` 태그로 올린다.
# 이미지는 Hostinger VPS Docker Manager(`deploy/hostinger/docker-compose.yml`)가 받아 간다 — 거기서는 빌드가 안 되기 때문이다.
# 비밀은 이미지에 들어가지 않는다(.env 는 .dockerignore · G-19). 패키지는 공개여야 VPS 가 로그인 없이 받는다.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/superpjh-stack/lcomfine_mes:latest
            ghcr.io/superpjh-stack/lcomfine_mes:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
